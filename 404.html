<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#111827" />
    <title>Seite nicht gefunden — Alexander Hermann</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0b1120;
        color: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 20% 20%, rgb(99 102 241 / 24%), transparent 32rem),
          radial-gradient(circle at 80% 80%, rgb(168 85 247 / 18%), transparent 28rem),
          #0b1120;
      }
      main {
        width: min(100%, 38rem);
        padding: clamp(2rem, 6vw, 4rem);
        text-align: center;
        border: 1px solid rgb(148 163 184 / 20%);
        border-radius: 1.5rem;
        background: rgb(15 23 42 / 88%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 35%);
        backdrop-filter: blur(1rem);
      }
      .logo {
        display: inline-grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        margin-bottom: 1.5rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        font-weight: 800;
      }
      .code {
        margin: 0;
        font-size: clamp(5rem, 20vw, 9rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
        color: transparent;
        background: linear-gradient(135deg, #818cf8, #d946ef);
        background-clip: text;
      }
      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(1.5rem, 5vw, 2rem);
      }
      p {
        margin: 0 auto 2rem;
        max-width: 30rem;
        color: #cbd5e1;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.5rem;
        border-radius: 0.65rem;
        background: #6366f1;
        color: white;
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }
      a:hover { background: #4f46e5; transform: translateY(-2px); }
      a:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 4px; }
      @media (prefers-reduced-motion: reduce) {
        a { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="logo" aria-hidden="true">AH</span>
      <p class="code" aria-label="Fehler 404">404</p>
      <h1>Seite nicht gefunden</h1>
      <p>Die gesuchte Seite wurde verschoben, gelöscht oder die Adresse ist nicht korrekt.</p>
      <a href="https://www.ahermann.dev/">Zurück zur Startseite</a>
    </main>
  </body>
</html>
