<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Chat-Bot restaurant ordering assistant</title>
  <desc id="desc">A terminal-style multilingual restaurant ordering dialog</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#background)"/>
  <circle cx="1080" cy="90" r="210" fill="#6366f1" opacity=".13"/>
  <circle cx="100" cy="750" r="260" fill="#06b6d4" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="110" y="92" width="980" height="616" rx="28" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <path d="M110 160h980" stroke="#334155" stroke-width="3"/>
    <circle cx="158" cy="126" r="11" fill="#fb7185"/>
    <circle cx="195" cy="126" r="11" fill="#fbbf24"/>
    <circle cx="232" cy="126" r="11" fill="#34d399"/>
    <text x="600" y="135" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="25" text-anchor="middle">restaurant-order-assistant — python</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="29">
      <text x="165" y="222" fill="#22d3ee">$ python main.py</text>
      <text x="165" y="279" fill="#f8fafc">Choose a language / Выберите язык /</text>
      <text x="165" y="321" fill="#f8fafc">Wählen Sie eine Sprache:</text>
      <text x="165" y="380" fill="#cbd5e1">1. English</text>
      <text x="165" y="425" fill="#cbd5e1">2. Русский</text>
      <text x="165" y="470" fill="#cbd5e1">3. Deutsch</text>
      <text x="165" y="534" fill="#818cf8">Enter your choice: 3</text>
      <text x="165" y="596" fill="#f8fafc">Wählen Sie eine Kategorie:</text>
      <text x="165" y="645" fill="url(#accent)">› Menü ansehen  ·  Bestellung verwalten  ·  Bestätigen</text>
    </g>
  </g>
</svg>
